<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 900" width="390" height="900">
  <!-- Fondo canvas crema -->
  <rect width="390" height="900" fill="#faf8f5"/>

  <!-- Status bar -->
  <rect width="390" height="44" fill="#faf8f5"/>
  <text x="195" y="30" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">9:41</text>

  <!-- Botón volver -->
  <text x="16" y="72" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#2d7a4f">← Volver</text>

  <!-- Título receta -->
  <text x="16" y="112" font-family="Nunito, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">Pollo al limón</text>
  <text x="16" y="142" font-family="Nunito, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">con arroz</text>

  <!-- Badges tipo + compatibilidad -->
  <rect x="16" y="160" width="64" height="26" rx="13" fill="#f5f0e8"/>
  <text x="48" y="177" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#3d3d3d" text-anchor="middle">Comida</text>

  <rect x="88" y="160" width="76" height="26" rx="13" fill="#f5f0e8"/>
  <text x="126" y="177" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#3d3d3d" text-anchor="middle">Sin gluten</text>

  <rect x="172" y="160" width="110" height="26" rx="13" fill="#f5f0e8"/>
  <text x="227" y="177" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#3d3d3d" text-anchor="middle">Alta en proteína</text>

  <!-- Separador -->
  <line x1="16" y1="202" x2="374" y2="202" stroke="#e8e4dc" stroke-width="1"/>

  <!-- Sección: Valores nutricionales + tiempo -->
  <text x="16" y="230" font-family="Nunito, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Valores nutricionales</text>

  <!-- Badge kcal -->
  <rect x="16" y="244" width="72" height="28" rx="14" fill="#e8f5ee"/>
  <text x="52" y="262" font-family="Nunito, sans-serif" font-size="12" font-weight="500" fill="#2d7a4f" text-anchor="middle">485 kcal</text>

  <!-- Badge carbos -->
  <rect x="96" y="244" width="62" height="28" rx="14" fill="#e8f5ee"/>
  <text x="127" y="262" font-family="Nunito, sans-serif" font-size="12" font-weight="500" fill="#2d7a4f" text-anchor="middle">42g carb</text>

  <!-- Badge grasas -->
  <rect x="166" y="244" width="62" height="28" rx="14" fill="#e8f5ee"/>
  <text x="197" y="262" font-family="Nunito, sans-serif" font-size="12" font-weight="500" fill="#2d7a4f" text-anchor="middle">15g gras</text>

  <!-- Badge proteínas -->
  <rect x="236" y="244" width="62" height="28" rx="14" fill="#e8f5ee"/>
  <text x="267" y="262" font-family="Nunito, sans-serif" font-size="12" font-weight="500" fill="#2d7a4f" text-anchor="middle">35g prot</text>

  <!-- Badge tiempo -->
  <rect x="306" y="244" width="62" height="28" rx="14" fill="#f5f0e8"/>
  <text x="337" y="262" font-family="Nunito, sans-serif" font-size="12" font-weight="500" fill="#7a7a72" text-anchor="middle">30 min</text>

  <!-- Separador -->
  <line x1="16" y1="290" x2="374" y2="290" stroke="#e8e4dc" stroke-width="1"/>

  <!-- Sección: Ingredientes -->
  <text x="16" y="318" font-family="Nunito, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Ingredientes</text>

  <text x="16" y="348" font-family="Nunito, sans-serif" font-size="15" font-weight="400" fill="#3d3d3d">•  Pechuga de pollo — 400g</text>
  <text x="16" y="374" font-family="Nunito, sans-serif" font-size="15" font-weight="400" fill="#3d3d3d">•  Arroz basmati — 200g</text>
  <text x="16" y="400" font-family="Nunito, sans-serif" font-size="15" font-weight="400" fill="#3d3d3d">•  Limón — 2 unidades</text>
  <text x="16" y="426" font-family="Nunito, sans-serif" font-size="15" font-weight="400" fill="#3d3d3d">•  Aceite de oliva — 2 cucharadas</text>
  <text x="16" y="452" font-family="Nunito, sans-serif" font-size="15" font-weight="400" fill="#3d3d3d">•  Ajo — 3 dientes</text>
  <text x="16" y="478" font-family="Nunito, sans-serif" font-size="15" font-weight="400" fill="#3d3d3d">•  Caldo de pollo — 150ml</text>
  <text x="16" y="504" font-family="Nunito, sans-serif" font-size="15" font-weight="400" fill="#3d3d3d">•  Sal y pimienta</text>

  <!-- Separador -->
  <line x1="16" y1="528" x2="374" y2="528" stroke="#e8e4dc" stroke-width="1"/>

  <!-- Sección: Compatibilidad familiar -->
  <text x="16" y="556" font-family="Nunito, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Compatibilidad familiar</text>

  <!-- Item compatible -->
  <rect x="16" y="570" width="358" height="40" rx="8" fill="#e8f5ee"/>
  <text x="32" y="595" font-family="Nunito, sans-serif" font-size="14" font-weight="400" fill="#2d7a4f">✓  Apto para toda la familia</text>

  <!-- Item compatible -->
  <rect x="16" y="618" width="358" height="40" rx="8" fill="#e8f5ee"/>
  <text x="32" y="643" font-family="Nunito, sans-serif" font-size="14" font-weight="400" fill="#2d7a4f">✓  Sin alérgenos registrados</text>

  <!-- Item compatible -->
  <rect x="16" y="666" width="358" height="40" rx="8" fill="#e8f5ee"/>
  <text x="32" y="691" font-family="Nunito, sans-serif" font-size="14" font-weight="400" fill="#2d7a4f">✓  Compatible con objetivo de Carlos (perder peso)</text>

  <!-- Separador -->
  <line x1="16" y1="726" x2="374" y2="726" stroke="#e8e4dc" stroke-width="1"/>

  <!-- Sección: Porciones -->
  <text x="16" y="754" font-family="Nunito, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Porciones</text>
  <text x="16" y="778" font-family="Nunito, sans-serif" font-size="15" font-weight="400" fill="#3d3d3d">4 personas</text>

  <!-- Botones de acción -->
  <!-- Botón Añadir al plan (primary rectangular) -->
  <rect x="16" y="810" width="358" height="48" rx="12" fill="#2d7a4f"/>
  <text x="195" y="839" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Añadir al plan</text>

  <!-- Botón Editar receta (secondary rectangular) -->
  <rect x="16" y="870" width="358" height="48" rx="12" fill="#ffffff" stroke="#2d7a4f" stroke-width="1.5"/>
  <text x="195" y="899" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#2d7a4f" text-anchor="middle">Editar receta</text>
</svg>
