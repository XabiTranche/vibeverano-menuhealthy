<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1000" width="390" height="1000">
  <!-- Fondo canvas crema -->
  <rect width="390" height="1000" fill="#faf8f5"/>

  <!-- Status bar -->
  <rect width="390" height="44" fill="#faf8f5"/>
  <text x="195" y="30" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">9:41</text>

  <!-- Título pantalla -->
  <text x="16" y="80" font-family="Nunito, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">Mi familia</text>

  <!-- Banner estado: Lista para planificar -->
  <rect x="16" y="96" width="358" height="36" rx="8" fill="#e8f5ee"/>
  <text x="195" y="119" font-family="Nunito, sans-serif" font-size="13" font-weight="600" fill="#2d7a4f" text-anchor="middle">✓ Lista para planificar</text>

  <!-- Sección: MIEMBROS -->
  <text x="16" y="162" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#7a7a72" letter-spacing="0.2">MIEMBROS</text>

  <!-- Miembro 1: Carlos -->
  <rect x="16" y="176" width="358" height="92" rx="16" fill="#ffffff"/>
  <rect x="16" y="176" width="358" height="92" rx="16" fill="none" stroke="#e8e4dc" stroke-width="0.5"/>
  <!-- Avatar -->
  <circle cx="48" cy="222" r="20" fill="#e8f5ee"/>
  <text x="48" y="228" font-family="Nunito, sans-serif" font-size="16" font-weight="700" fill="#2d7a4f" text-anchor="middle">C</text>
  <!-- Info -->
  <text x="78" y="206" font-family="Nunito, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Carlos (Yo)</text>
  <text x="78" y="226" font-family="Nunito, sans-serif" font-size="13" font-weight="400" fill="#3d3d3d">Objetivo: Perder peso</text>
  <!-- Badge restricción -->
  <rect x="78" y="236" width="140" height="22" rx="11" fill="#f5f0e8"/>
  <text x="148" y="251" font-family="Nunito, sans-serif" font-size="11" font-weight="600" fill="#3d3d3d" text-anchor="middle">🚫 Intolerancia lactosa</text>
  <!-- Flecha navegación -->
  <text x="358" y="226" font-family="Nunito, sans-serif" font-size="16" fill="#a8a8a0" text-anchor="end">›</text>

  <!-- Miembro 2: María -->
  <rect x="16" y="280" width="358" height="92" rx="16" fill="#ffffff"/>
  <rect x="16" y="280" width="358" height="92" rx="16" fill="none" stroke="#e8e4dc" stroke-width="0.5"/>
  <!-- Avatar -->
  <circle cx="48" cy="326" r="20" fill="#f5f0e8"/>
  <text x="48" y="332" font-family="Nunito, sans-serif" font-size="16" font-weight="700" fill="#7a7a72" text-anchor="middle">M</text>
  <!-- Info -->
  <text x="78" y="310" font-family="Nunito, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">María</text>
  <text x="78" y="330" font-family="Nunito, sans-serif" font-size="13" font-weight="400" fill="#3d3d3d">Objetivo: Mantenimiento</text>
  <!-- Badge restricción -->
  <rect x="78" y="340" width="148" height="22" rx="11" fill="#f5f0e8"/>
  <text x="152" y="355" font-family="Nunito, sans-serif" font-size="11" font-weight="600" fill="#3d3d3d" text-anchor="middle">🚫 Alergia frutos secos</text>
  <!-- Flecha -->
  <text x="358" y="330" font-family="Nunito, sans-serif" font-size="16" fill="#a8a8a0" text-anchor="end">›</text>

  <!-- Miembro 3: Lucas -->
  <rect x="16" y="384" width="358" height="92" rx="16" fill="#ffffff"/>
  <rect x="16" y="384" width="358" height="92" rx="16" fill="none" stroke="#e8e4dc" stroke-width="0.5"/>
  <!-- Avatar -->
  <circle cx="48" cy="430" r="20" fill="#f5f0e8"/>
  <text x="48" y="436" font-family="Nunito, sans-serif" font-size="16" font-weight="700" fill="#7a7a72" text-anchor="middle">L</text>
  <!-- Info -->
  <text x="78" y="414" font-family="Nunito, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Lucas</text>
  <text x="78" y="434" font-family="Nunito, sans-serif" font-size="13" font-weight="400" fill="#7a7a72">8 años</text>
  <!-- Badge sin restricciones -->
  <rect x="78" y="444" width="120" height="22" rx="11" fill="#f5f0e8"/>
  <text x="138" y="459" font-family="Nunito, sans-serif" font-size="11" font-weight="600" fill="#7a7a72" text-anchor="middle">Sin restricciones</text>
  <!-- Flecha -->
  <text x="358" y="434" font-family="Nunito, sans-serif" font-size="16" fill="#a8a8a0" text-anchor="end">›</text>

  <!-- Miembro 4: Sofía -->
  <rect x="16" y="488" width="358" height="92" rx="16" fill="#ffffff"/>
  <rect x="16" y="488" width="358" height="92" rx="16" fill="none" stroke="#e8e4dc" stroke-width="0.5"/>
  <!-- Avatar -->
  <circle cx="48" cy="534" r="20" fill="#f5f0e8"/>
  <text x="48" y="540" font-family="Nunito, sans-serif" font-size="16" font-weight="700" fill="#7a7a72" text-anchor="middle">S</text>
  <!-- Info -->
  <text x="78" y="518" font-family="Nunito, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Sofía</text>
  <text x="78" y="538" font-family="Nunito, sans-serif" font-size="13" font-weight="400" fill="#7a7a72">5 años</text>
  <!-- Badge -->
  <rect x="78" y="548" width="120" height="22" rx="11" fill="#f5f0e8"/>
  <text x="138" y="563" font-family="Nunito, sans-serif" font-size="11" font-weight="600" fill="#7a7a72" text-anchor="middle">Sin restricciones</text>
  <!-- Flecha -->
  <text x="358" y="538" font-family="Nunito, sans-serif" font-size="16" fill="#a8a8a0" text-anchor="end">›</text>

  <!-- Separador -->
  <line x1="16" y1="600" x2="374" y2="600" stroke="#e8e4dc" stroke-width="1"/>

  <!-- Sección: COMIDAS DEL DÍA -->
  <text x="16" y="630" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#7a7a72" letter-spacing="0.2">COMIDAS DEL DÍA</text>

  <!-- Chips de momentos activos -->
  <rect x="16" y="644" width="82" height="32" rx="9999" fill="#2d7a4f"/>
  <text x="57" y="664" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Desayuno</text>

  <rect x="106" y="644" width="70" height="32" rx="9999" fill="#2d7a4f"/>
  <text x="141" y="664" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Comida</text>

  <rect x="184" y="644" width="58" height="32" rx="9999" fill="#2d7a4f"/>
  <text x="213" y="664" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Cena</text>

  <rect x="250" y="644" width="60" height="32" rx="9999" fill="#f5f0e8"/>
  <text x="280" y="664" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#3d3d3d" text-anchor="middle">Snack</text>

  <text x="16" y="700" font-family="Nunito, sans-serif" font-size="13" font-weight="400" fill="#7a7a72">Selecciona los momentos de comida que planificas</text>

  <!-- Separador -->
  <line x1="16" y1="724" x2="374" y2="724" stroke="#e8e4dc" stroke-width="1"/>

  <!-- Sección: RESUMEN RESTRICCIONES -->
  <text x="16" y="752" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#7a7a72" letter-spacing="0.2">RESTRICCIONES DEL HOGAR</text>

  <rect x="16" y="766" width="358" height="40" rx="8" fill="#ffffff"/>
  <text x="32" y="791" font-family="Nunito, sans-serif" font-size="14" font-weight="400" fill="#3d3d3d">🚫 Sin lactosa (Carlos)</text>

  <rect x="16" y="814" width="358" height="40" rx="8" fill="#ffffff"/>
  <text x="32" y="839" font-family="Nunito, sans-serif" font-size="14" font-weight="400" fill="#3d3d3d">🚫 Sin frutos secos (María)</text>

  <!-- Botón Añadir miembro -->
  <rect x="16" y="874" width="358" height="48" rx="12" fill="#2d7a4f"/>
  <text x="195" y="903" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Añadir miembro</text>

  <!-- Tab Bar -->
  <rect x="0" y="940" width="390" height="60" fill="#ffffff"/>
  <line x1="0" y1="940" x2="390" y2="940" stroke="#e8e4dc" stroke-width="1"/>
  
  <!-- Tab: Planificador -->
  <text x="48" y="968" font-family="Nunito, sans-serif" font-size="16" fill="#7a7a72" text-anchor="middle">📅</text>
  <text x="48" y="986" font-family="Nunito, sans-serif" font-size="11" font-weight="500" fill="#7a7a72" text-anchor="middle">Plan</text>
  
  <!-- Tab: Recetas -->
  <text x="146" y="968" font-family="Nunito, sans-serif" font-size="16" fill="#7a7a72" text-anchor="middle">📖</text>
  <text x="146" y="986" font-family="Nunito, sans-serif" font-size="11" font-weight="500" fill="#7a7a72" text-anchor="middle">Recetas</text>
  
  <!-- Tab: Compra -->
  <text x="244" y="968" font-family="Nunito, sans-serif" font-size="16" fill="#7a7a72" text-anchor="middle">🛒</text>
  <text x="244" y="986" font-family="Nunito, sans-serif" font-size="11" font-weight="500" fill="#7a7a72" text-anchor="middle">Compra</text>
  
  <!-- Tab: Familia (activo) -->
  <text x="342" y="968" font-family="Nunito, sans-serif" font-size="16" fill="#2d7a4f" text-anchor="middle">👥</text>
  <text x="342" y="986" font-family="Nunito, sans-serif" font-size="11" font-weight="500" fill="#2d7a4f" text-anchor="middle">Familia</text>
</svg>
