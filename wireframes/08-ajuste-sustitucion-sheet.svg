  <rect x="55" y="91" width="320" height="78" class="card" rx="18" ry="18"/><text x="73" y="115" class="subtitle">Cena del jueves</text><text x="73" y="139" class="body">Crema + tortilla actual</text><text x="73" y="157" class="meta">Acción: sustituir receta</text><rect x="43" y="415" width="344" height="360" rx="26" ry="26" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="67" y="453" class="subtitle">Sustituciones compatibles</text><text x="67" y="475" class="meta">Sin gluten · niños OK · compra impacta</text><rect x="55" y="491" width="320" height="74" class="card-soft" rx="16" ry="16"/><text x="73" y="513" class="label">Merluza + puré</text><text x="73" y="535" class="body">Compatibilidad total</text><text x="73" y="553" class="meta">Sin cambios críticos</text><rect x="55" y="577" width="320" height="74" class="warn" rx="16" ry="16"/><text x="73" y="599" class="label">Ensalada templada</text><text x="73" y="621" class="body">OK pero menos saciante</text><text x="73" y="639" class="meta">Revisar objetivo proteína</text><rect x="55" y="663" width="320" height="74" class="warn" rx="16" ry="16"/><text x="73" y="685" class="label">Pasta de legumbre</text><text x="73" y="707" class="body">Compatible</text><text x="73" y="725" class="meta">Añade 2 items a compra</text><rect x="47" y="779" width="336" height="64" class="card-soft" rx="20" ry="20"/><rect x="54" y="795" width="50" height="34" class="cta" rx="12" ry="12"/><text x="79" y="844" class="tiny" text-anchor="middle">Plan</text><rect x="141" y="795" width="50" height="34" class="card-soft" rx="12" ry="12"/><text x="166" y="844" class="tiny" text-anchor="middle">Recetas</text><rect x="229" y="795" width="50" height="34" class="card-soft" rx="12" ry="12"/><text x="254" y="844" class="tiny" text-anchor="middle">Compra</text><rect x="316" y="795" width="50" height="34" class="card-soft" rx="12" ry="12"/><text x="341" y="844" class="tiny" text-anchor="middle">Familia</text>
