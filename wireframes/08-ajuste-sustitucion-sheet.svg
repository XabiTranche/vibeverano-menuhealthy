<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932">
  <style>
    .bg { fill: #f5f7f6; }
    .phone { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
    .screen { fill: #fcfcfb; stroke: #cbd5e1; stroke-width: 1.5; }
    .bar { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; }
    .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 16; }
    .card-soft { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 14; }
    .cta { fill: #d1fae5; stroke: #059669; stroke-width: 1.5; rx: 14; }
    .warn { fill: #ffedd5; stroke: #ea580c; stroke-width: 1.5; rx: 12; }
    .chip { fill: #eef2f7; stroke: #94a3b8; stroke-width: 1; rx: 10; }
    .title { font: 700 20px Inter, Arial, sans-serif; fill: #0f172a; }
