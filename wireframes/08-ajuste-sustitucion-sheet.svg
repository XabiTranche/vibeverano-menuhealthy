    .body { font: 500 12px Inter, Arial, sans-serif; fill: #1f2937; }
    .tiny { font: 500 10px Inter, Arial, sans-serif; fill: #64748b; }
    .center { text-anchor: middle; dominant-baseline: middle; }
    .outline { fill: none; stroke: #94a3b8; stroke-width: 1.2; rx: 12; }
    .icon { fill: #e2e8f0; stroke: #64748b; stroke-width: 1; }
    .divider { stroke: #cbd5e1; stroke-width: 1; }
</style>
  <rect x="0" y="0" width="430" height="932" class="bg"/>
