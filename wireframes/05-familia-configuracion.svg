  <rect x="78" y="340" width="148" height="22" rx="11" fill="#f5f0e8"/>
  <text x="152" y="355" font-family="Nunito, sans-serif" font-size="11" font-weight="600" fill="#3d3d3d" text-anchor="middle">🚫 Alergia frutos secos</text>
  <!-- Flecha -->
  <text x="358" y="330" font-family="Nunito, sans-serif" font-size="16" fill="#a8a8a0" text-anchor="end">›</text>

