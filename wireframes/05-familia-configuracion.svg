  <rect x="16" y="96" width="358" height="36" rx="8" fill="#e8f5ee"/>
  <text x="195" y="119" font-family="Nunito, sans-serif" font-size="13" font-weight="600" fill="#2d7a4f" text-anchor="middle">✓ Lista para planificar</text>

  <!-- Sección: MIEMBROS -->
  <text x="16" y="162" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#7a7a72" letter-spacing="0.2">MIEMBROS</text>

  <!-- Miembro 1: Carlos -->
  <rect x="16" y="176" width="358" height="92" rx="16" fill="#ffffff"/>
  <rect x="16" y="176" width="358" height="92" rx="16" fill="none" stroke="#e8e4dc" stroke-width="0.5"/>
  <!-- Avatar -->
  <circle cx="48" cy="222" r="20" fill="#e8f5ee"/>
  <text x="48" y="228" font-family="Nunito, sans-serif" font-size="16" font-weight="700" fill="#2d7a4f" text-anchor="middle">C</text>
  <!-- Info -->
  <text x="78" y="206" font-family="Nunito, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Carlos (Yo)</text>
  <text x="78" y="226" font-family="Nunito, sans-serif" font-size="13" font-weight="400" fill="#3d3d3d">Objetivo: Perder peso</text>
  <!-- Badge restricción -->
  <rect x="78" y="236" width="140" height="22" rx="11" fill="#f5f0e8"/>
  <text x="148" y="251" font-family="Nunito, sans-serif" font-size="11" font-weight="600" fill="#3d3d3d" text-anchor="middle">🚫 Intolerancia lactosa</text>
  <!-- Flecha navegación -->
  <text x="358" y="226" font-family="Nunito, sans-serif" font-size="16" fill="#a8a8a0" text-anchor="end">›</text>

  <!-- Miembro 2: María -->
  <rect x="16" y="280" width="358" height="92" rx="16" fill="#ffffff"/>
  <rect x="16" y="280" width="358" height="92" rx="16" fill="none" stroke="#e8e4dc" stroke-width="0.5"/>
  <!-- Avatar -->
  <circle cx="48" cy="326" r="20" fill="#f5f0e8"/>
  <text x="48" y="332" font-family="Nunito, sans-serif" font-size="16" font-weight="700" fill="#7a7a72" text-anchor="middle">M</text>
  <!-- Info -->
  <text x="78" y="310" font-family="Nunito, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">María</text>
