<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1000" width="390" height="1000">
  <!-- Fondo canvas crema -->
  <rect width="390" height="1000" fill="#faf8f5"/>

  <!-- Status bar -->
  <rect width="390" height="44" fill="#faf8f5"/>
  <text x="195" y="30" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">9:41</text>

  <!-- Título pantalla -->
  <text x="16" y="80" font-family="Nunito, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">Mi familia</text>

