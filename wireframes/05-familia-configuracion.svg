  <rect x="16" y="488" width="358" height="92" rx="16" fill="#ffffff"/>
  <rect x="16" y="488" width="358" height="92" rx="16" fill="none" stroke="#e8e4dc" stroke-width="0.5"/>
  <!-- Avatar -->
  <circle cx="48" cy="534" r="20" fill="#f5f0e8"/>
  <text x="48" y="540" font-family="Nunito, sans-serif" font-size="16" font-weight="700" fill="#7a7a72" text-anchor="middle">S</text>
  <!-- Info -->
  <text x="78" y="518" font-family="Nunito, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Sofía</text>
  <text x="78" y="538" font-family="Nunito, sans-serif" font-size="13" font-weight="400" fill="#7a7a72">5 años</text>
