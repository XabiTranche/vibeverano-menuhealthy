  <rect x="16" y="644" width="82" height="32" rx="12" fill="#2d7a4f"/>
  <text x="57" y="664" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Desayuno</text>

  <rect x="106" y="644" width="70" height="32" rx="12" fill="#2d7a4f"/>
  <text x="141" y="664" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Comida</text>

  <rect x="184" y="644" width="58" height="32" rx="12" fill="#2d7a4f"/>
  <text x="213" y="664" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Cena</text>

  <rect x="250" y="644" width="60" height="32" rx="12" fill="#f5f0e8"/>
  <text x="280" y="664" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#3d3d3d" text-anchor="middle">Snack</text>

  <text x="16" y="700" font-family="Nunito, sans-serif" font-size="13" font-weight="400" fill="#7a7a72">Selecciona los momentos de comida que planificas</text>

  <!-- Separador -->
  <line x1="16" y1="724" x2="374" y2="724" stroke="#e8e4dc" stroke-width="1"/>

  <!-- Sección: RESUMEN RESTRICCIONES -->
  <text x="16" y="752" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#7a7a72" letter-spacing="0.2">RESTRICCIONES DEL HOGAR</text>

  <rect x="16" y="766" width="358" height="40" rx="8" fill="#ffffff"/>
  <text x="32" y="791" font-family="Nunito, sans-serif" font-size="14" font-weight="400" fill="#3d3d3d">🚫 Sin lactosa (Carlos)</text>

  <rect x="16" y="814" width="358" height="40" rx="8" fill="#ffffff"/>
  <text x="32" y="839" font-family="Nunito, sans-serif" font-size="14" font-weight="400" fill="#3d3d3d">🚫 Sin frutos secos (María)</text>

  <!-- Botón Añadir miembro -->
  <rect x="16" y="874" width="358" height="48" rx="12" fill="#2d7a4f"/>
  <text x="195" y="903" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Añadir miembro</text>

  <!-- Tab Bar -->
  <rect x="0" y="940" width="390" height="60" fill="#ffffff"/>
  <line x1="0" y1="940" x2="390" y2="940" stroke="#e8e4dc" stroke-width="1"/>
  
  <!-- Tab: Plan (inactivo) -->
  <g transform="translate(36,952)">
    <rect x="0" y="0" width="16" height="14" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="0" y1="4" x2="16" y2="4" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="5" y1="0" x2="5" y2="4" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="11" y1="0" x2="11" y2="4" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>
  <text x="48" y="986" font-family="Nunito, sans-serif" font-size="11" font-weight="500" fill="#7a7a72" text-anchor="middle">Plan</text>
  
  <!-- Tab: Recetas (inactivo) -->
  <g transform="translate(134,952)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="3" y1="4" x2="11" y2="4" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="3" y1="7" x2="11" y2="7" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="3" y1="10" x2="8" y2="10" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>
  <text x="146" y="986" font-family="Nunito, sans-serif" font-size="11" font-weight="500" fill="#7a7a72" text-anchor="middle">Recetas</text>
  
  <!-- Tab: Compra (inactivo) -->
  <g transform="translate(232,952)">
    <circle cx="4" cy="14" r="1.5" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="12" cy="14" r="1.5" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M0,0 L2,0 L4,10 L14,10 L16,3 L5,3" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>
  <text x="244" y="986" font-family="Nunito, sans-serif" font-size="11" font-weight="500" fill="#7a7a72" text-anchor="middle">Compra</text>
  
  <!-- Tab: Familia (activo - verde relleno) -->
  <g transform="translate(330,952)">
    <circle cx="7" cy="4" r="3" fill="#2d7a4f" stroke="#2d7a4f" stroke-width="1.5"/>
    <path d="M0,14 C0,10 4,8 7,8 C10,8 14,10 14,14" fill="#2d7a4f" stroke="#2d7a4f" stroke-width="1.5"/>
  </g>
  <text x="342" y="986" font-family="Nunito, sans-serif" font-size="11" font-weight="500" fill="#2d7a4f" text-anchor="middle">Familia</text>
</svg>
